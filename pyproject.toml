[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-telemetry-pipeline"
version = "0.1.0"
description = "MQTT/MODBUS edge telemetry -> Kafka -> TimescaleDB, orchestrated by Dagster, served over a secured FastAPI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "paho-mqtt>=2.1",
    "confluent-kafka>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pymodbus>=3.10",
    "dagster>=1.8",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools]
packages = ["edge", "bridge", "stream", "pipelines", "api", "common", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose stack"]
