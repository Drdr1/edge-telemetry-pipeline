name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -m "not integration" -q

  integration-db:
    runs-on: ubuntu-latest
    needs: lint-unit
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: telemetry
          POSTGRES_DB: telemetry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telemetry" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://telemetry:telemetry@localhost:5432/telemetry
      TEST_DATABASE_URL: postgresql://telemetry:telemetry@localhost:5432/telemetry
      PGPASSWORD: telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Apply schema
        run: psql -h localhost -U telemetry -d telemetry -v ON_ERROR_STOP=1 -f sql/001_schema.sql
      - run: pytest -m integration -q
      - name: Ingest benchmark
        run: python -m scripts.bench_ingest 100000 | tee -a "$GITHUB_STEP_SUMMARY"

  e2e-compose:
    runs-on: ubuntu-latest
    needs: lint-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: docker compose up -d --build --wait --wait-timeout 300 mosquitto redpanda timescaledb
      - run: docker compose up -d --build
      - name: Assert edge -> Kafka -> TimescaleDB -> API
        run: python -m scripts.e2e_check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=80
      - if: always()
        run: docker compose down -v
